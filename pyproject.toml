[project]
name = "investor-intelligence-system"
version = "0.1.0"
description = "Hybrid RAG platform for extracting investment insights from financial documents using LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.6.2",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "pinecone>=10.0.0",
    "psycopg2>=2.9.12",
    "pymupdf4llm>=1.28.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
]
